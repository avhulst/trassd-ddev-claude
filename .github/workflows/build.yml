name: build-claude-code-image

# Rebuilds the claude-only image every day. It only pushes a new image when npm
# actually has a newer Claude Code version than what is already published, so
# unchanged days are a no-op. You can also trigger it by hand (with an optional
# force flag) or on changes to the Dockerfile / this workflow.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even if this version is already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "claude-code/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/claude-code

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.gate.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest Claude Code version
        id: ver
        run: |
          VERSION="$(npm view @anthropic-ai/claude-code version)"
          [ -n "$VERSION" ] || { echo "could not resolve version from npm"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest published Claude Code: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: gate
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:${{ steps.ver.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force requested — will build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$IMAGE not found — will build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.gate.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./claude-code
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    # Only prune after a new image was actually published.
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Keep only the 3 newest images, delete older ones
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # owner + package default to this repo's project automatically.
          packages: claude-code
          # Keep the 3 most recent tagged releases; older tagged versions and
          # their multi-arch child manifests are deleted automatically.
          keep-n-tagged: 3
          # Remove untagged leftovers not belonging to a kept image.
          delete-untagged: true
          # ⚠️ Set to true once and run via "Run workflow" to preview what WOULD
          # be deleted (see the job log) before trusting it. Then set back to false.
          dry-run: false
