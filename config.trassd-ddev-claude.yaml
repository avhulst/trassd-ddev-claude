#ddev-generated
# Claude Code state persistence for the trassd-ddev-claude add-on.
#
# Claude's config lives in DDEV's global cache volume, which survives
# `ddev restart`, `ddev rebuild`, `ddev poweroff` and `ddev delete`, stays out
# of Mutagen sync and never lands in git. The claude wrapper points
# CLAUDE_CONFIG_DIR there; login, settings and plugins are shared across
# projects, sessions and memory are kept per DDEV project.
#
# Tokens are taken from the host shell at `ddev start` (export them e.g. in
# ~/.zshrc); unset ones stay empty, which Claude and Context7 treat as absent.
web_environment:
    - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
hooks:
    # Docker never refreshes a local :latest on its own, and the web-build copies
    # whatever is local. Pull first; offline or on errors keep the current one.
    pre-start:
        - exec-host: docker pull -q ghcr.io/avhulst/claude-code:latest >/dev/null 2>&1 || true
    post-start:
        - exec: |
              set -eu
              cache_dir="${CLAUDE_CODE_CACHE_DIR:-/mnt/ddev-global-cache/claude-code/shared}"
              mkdir -p "${cache_dir}/.claude"
              # Migrate the pre-add-on layout: with CLAUDE_CONFIG_DIR set, Claude
              # keeps .claude.json inside the config dir. Never overwrite. The
              # symlink keeps projects still on the old setup on the same file.
              if [ -f "${cache_dir}/.claude.json" ] && [ ! -e "${cache_dir}/.claude/.claude.json" ]; then
                  mv "${cache_dir}/.claude.json" "${cache_dir}/.claude/.claude.json"
                  ln -s .claude/.claude.json "${cache_dir}/.claude.json"
              fi
