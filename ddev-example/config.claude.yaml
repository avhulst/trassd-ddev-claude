#ddev-generated
# Claude Code auth + state persistence.
#
# Credentials and state live in DDEV's global cache volume
# (/mnt/ddev-global-cache), which survives `ddev restart`, `ddev rebuild`,
# `ddev poweroff` and even `ddev delete` -- so you log in once and it sticks,
# stays out of Mutagen sync, and never lands in git.
#
# Default below is a SHARED login across all your projects (one login for
# everything). To isolate state per project instead, swap "shared" for
# "${DDEV_PROJECT:-default}".
hooks:
  post-start:
    - exec: |
        set -eu
        CC_DIR="/mnt/ddev-global-cache/claude-code/shared"
        mkdir -p "${CC_DIR}/.claude"
        [ -f "${CC_DIR}/.claude.json" ] || echo '{}' > "${CC_DIR}/.claude.json"
        rm -rf "${HOME}/.claude" "${HOME}/.claude.json" 2>/dev/null || true
        ln -s "${CC_DIR}/.claude.json" "${HOME}/.claude.json"
        ln -s "${CC_DIR}/.claude" "${HOME}/.claude"
